name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app/

      - name: Format check (ruff)
        run: ruff format --check app/

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports

      - name: Run tests (pytest)
        env:
          APP_ENV: test
          QDRANT_URL: ""
          QDRANT_LOCAL_PATH: /tmp/qdrant_test
          REDIS_URL: redis://localhost:6379
        run: pytest app/tests/unit/ -v --tb=short

  frontend:
    name: Frontend — lint, type-check, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    # Only run if frontend/ exists (Phase 8+)
    steps:
      - uses: actions/checkout@v4

      - name: Check if frontend exists
        id: frontend_check
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.frontend_check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend_check.outputs.exists == 'true'
        run: npm ci

      - name: Type check (tsc)
        if: steps.frontend_check.outputs.exists == 'true'
        run: npm run type-check

      - name: Lint (eslint)
        if: steps.frontend_check.outputs.exists == 'true'
        run: npm run lint

      - name: Build
        if: steps.frontend_check.outputs.exists == 'true'
        run: npm run build
